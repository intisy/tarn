name: Check docs

# The checker never calls the network, so this workflow hands it the owner's repos as a snapshot file.
# A caller grants contents: read, and issues: write for warn mode.
on:
  workflow_call:
    inputs:
      standard-ref:
        description: 'The intisy/tarn commit whose checker judges the docs'
        required: true
        type: string
      mode:
        description: 'check (fail on a refusal) or warn (keep the Docs drift issue)'
        required: false
        type: string
        default: 'check'
      default-branch:
        description: 'The branch warn mode reads; empty takes the repository default branch'
        required: false
        type: string
        default: ''
    secrets:
      envPAT:
        description: 'Token able to list the owner''s private repos; falls back to the job token, which sees public ones only'
        required: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse a mode that does not exist
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            check|warn) ;;
            *) echo "::error::mode '$MODE' is neither check nor warn."; exit 1 ;;
          esac

      - name: Pick the branch to read
        id: branch
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ inputs.default-branch || github.event.repository.default_branch }}
        run: |
          if [ "$MODE" = warn ]; then
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      # Full history, because a shallow clone makes every source doc look as new as its code.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.ref }}
          fetch-depth: ${{ inputs.mode == 'warn' && '0' || '1' }}
          path: repository

      - name: Checkout the standard
        uses: actions/checkout@v4
        with:
          repository: intisy/tarn
          ref: ${{ inputs.standard-ref }}
          path: standard

      - name: Build the checker
        shell: bash
        run: |
          set -euo pipefail
          cmake -S standard -B "$RUNNER_TEMP/tarn-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tarn-build" --target tarn-check --parallel
          echo "TARN_CHECK=$RUNNER_TEMP/tarn-build/tarn-check" >> "$GITHUB_ENV"

      - name: Warn that private repos are unseen
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.envPAT != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::No envPAT was given, so the snapshot holds public repos only and no private repo can be checked for."
          fi

      - name: Write the repos snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.envPAT || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/repos.snapshot"
          # A 404 means the file is absent; any other failure must stop the run rather than read as "not".
          version_of() {
            local answer status
            if answer=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$1/contents/$2" 2>"$RUNNER_TEMP/api.err"); then
              printf '%s\n' "$answer" | head -n 1 | tr -d '\r'
              return 0
            fi
            status=$(grep -o 'HTTP [0-9]*' "$RUNNER_TEMP/api.err" | head -n 1 || true)
            [ "$status" = "HTTP 404" ] && return 0
            cat "$RUNNER_TEMP/api.err" >&2
            return 1
          }
          follows_tarn() {
            local path line
            for path in docs/VERSION VERSION; do
              line=$(version_of "$1" "$path") || return 1
              if printf '%s' "$line" | grep -Eq '^tarn [0-9]+$'; then
                echo follows
                return 0
              fi
            done
            echo not
          }
          if [ "$(gh api "users/$OWNER" --jq .type)" = Organization ]; then
            listing="orgs/$OWNER/repos?type=all&per_page=100"
          else
            listing="users/$OWNER/repos?type=owner&per_page=100"
          fi
          gh api --paginate "$listing" --jq '.[] | .full_name + " " + (if .visibility == "public" then "public" else "private" end)' \
            > "$RUNNER_TEMP/repos.txt"
          : > "$snapshot"
          while read -r name visibility; do
            follows=$(follows_tarn "$name")
            echo "$name $visibility $follows" >> "$snapshot"
          done < "$RUNNER_TEMP/repos.txt"
          echo "TARN_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          cat "$snapshot"

      - name: Check
        if: ${{ inputs.mode == 'check' }}
        shell: bash
        run: '"$TARN_CHECK" --snapshot "$TARN_SNAPSHOT" --repository "$GITHUB_REPOSITORY" repository'

      - name: Collect the warnings
        if: ${{ inputs.mode == 'warn' }}
        shell: bash
        run: |
          set -euo pipefail
          "$TARN_CHECK" --warn-only --snapshot "$TARN_SNAPSHOT" --repository "$GITHUB_REPOSITORY" repository \
            > "$RUNNER_TEMP/warnings.txt"
          cat "$RUNNER_TEMP/warnings.txt"

      - name: Keep the Docs drift issue
        if: ${{ inputs.mode == 'warn' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Docs drift"
          warnings="$RUNNER_TEMP/warnings.txt"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -s "$warnings" ]; then
            body="$RUNNER_TEMP/body.md"
            { echo "tarn-check found what a single push cannot see:"; echo; echo '```'; cat "$warnings"; echo '```'; } > "$body"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "No drift left."
          fi
