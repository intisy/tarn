name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    uses: ./.github/workflows/check-docs.yml
    with:
      standard-ref: ${{ github.sha }}
      mode: check
    secrets:
      envPAT: ${{ secrets.TARN_TOKEN }}

  warn:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/check-docs.yml
    with:
      standard-ref: ${{ github.sha }}
      mode: warn
      default-branch: ${{ github.ref_name }}
    secrets:
      envPAT: ${{ secrets.TARN_TOKEN }}
